{% from "_form_macros.html" import qlabel, banner, yesno with context %}
{{ banner('section_lifestyle') }}
<div class="card">
  {{ qlabel('q_exercise') }}
  {{ yesno('exercise') }}
  <div class="detail" id="d-exercise">
    {{ qlabel('q_exercise_detail') }}
    <div class="stepper" data-target="f-exercise_detail"
         data-suffix-cs="{{ bi('exercise_times_suffix')[0] }}"
         data-suffix-en="{{ bi('exercise_times_suffix')[1] }}" data-max="14">
      <button type="button" class="stepper-btn" data-delta="-1">−</button>
      <span class="stepper-value">0</span>
      <button type="button" class="stepper-btn" data-delta="1">+</button>
    </div>
    <input type="hidden" id="f-exercise_detail" value="{{ profile.exercise_detail }}">
  </div>

  {{ qlabel('q_surgery') }}
  {{ yesno('recent_surgery') }}
  <div class="detail" id="d-recent_surgery">
    {{ qlabel('if_yes_specify') }}
    <input type="text" id="f-surgery_detail" value="{{ profile.surgery_detail }}">
  </div>
</div>
