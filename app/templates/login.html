{% extends "base.html" %}
{% block title %}{{ t('login') }} – {{ t('app_name') }}{% endblock %}
{% block content %}
<div style="max-width:420px;margin:2rem auto;">
  <div style="text-align:center;margin-bottom:1.5rem;">
    <img src="/static/logo.png" alt="" style="height:90px;margin-bottom:0.5rem;" onerror="this.remove()">
    <h1 style="font-family:var(--serif);font-size:1.9rem;color:var(--accent-dark);font-weight:700;">{{ t('app_name') }}</h1>
    <p style="color:var(--gold);letter-spacing:0.08em;font-size:0.9rem;">{{ t('brand_sub') }}</p>
    <p style="color:var(--muted);margin-top:0.5rem;">{{ bi('tagline')[0] }} · <span style="font-family:var(--serif);">{{ bi('tagline')[1] }}</span></p>
  </div>

  {% if error %}
    <div class="flash error">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form method="post" action="/auth/staff-login">
      <label for="staff-name">{{ bi('staff_name_label')[0] }} / {{ bi('staff_name_label')[1] }}</label>
      <input type="text" id="staff-name" name="name" required autocomplete="username"
             style="margin-bottom:0.9rem;">
      <label for="staff-pin">{{ bi('pin_label')[0] }} / {{ bi('pin_label')[1] }}</label>
      <input type="text" id="staff-pin" name="pin" inputmode="numeric" maxlength="4"
             pattern="[0-9]{4}" required autocomplete="current-password"
             style="margin-bottom:0.9rem;">
      <button type="submit" class="btn btn--full">{{ bi('login')[0] }} / {{ bi('login')[1] }}</button>
    </form>
  </div>
</div>
{% endblock %}
